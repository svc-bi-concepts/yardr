# The yard's Slack app as one document, for the operator to paste where
# Slack creates an app from a manifest (api.slack.com/apps, Create New
# App, From a manifest), SETUP.md step 1. It names the bot user and the
# scopes, and deliberately no event subscriptions and no Request URL: a
# manifest that names events without a Request URL or Socket Mode does
# not validate, so the app is created before its hook address exists and
# the two bot events are subscribed in step 6, once the hook stands and
# Slack can verify its address.
#
# The scopes are the bot's alone (section 3.7 step 1 of
# docs/design/2026-10-17-yardr-pcxd-slack.md, widened by the channel
# messages of the Slack pack's join call): app_mentions:read so the bot
# is told when it is mentioned, the four histories so conversations.replies
# reads a heard thread back on the bot token in each kind of conversation,
# chat:write so it answers in the thread, channels:read and groups:read so
# conversations.list names the channels it is not in, and channels:join so
# conversations.join puts it in a public one. The bot hears a channel,
# group or group direct message it is in through message.channels,
# message.groups and message.mpim, subscribed in SETUP.md step 6, so those
# three histories read back what it stored.
_metadata:
  major_version: 1
display_information:
  name: yardr
features:
  bot_user:
    display_name: yardr
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:join
      - channels:read
      - groups:history
      - groups:read
      - im:history
      - mpim:history
      - chat:write
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
